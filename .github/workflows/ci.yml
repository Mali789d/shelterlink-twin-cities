# Run every test on every push and pull request to main.
# Public-repo Actions usage is free; no secrets, read-only contents access.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Suites finish in about two minutes; bound a hung or malicious job well
    # below the 6-hour GitHub-hosted execution limit.
    timeout-minutes: 10
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Do not leave the runner token in the runner's git config: later
          # steps execute repository code, including from pull requests.
          persist-credentials: false
      # actions/setup-python v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node --test tests/test_web_*.mjs
